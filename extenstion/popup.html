<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Webpage Summarizer</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 360px;
      height: 380px;
      overflow: hidden;
      background-color: #f9f9f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      width: 360px;
      height: 380px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      width: 100%;
      padding: 11px 16px;
      background-color: #4F46E5;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    button:hover {
      background-color: #4338CA;
    }
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    .loader {
      text-align: center;
      color: #6b7280;
      margin-top: 12px;
      font-size: 13px;
      display: none;
    }
    #result {
      margin-top: 12px;
      font-size: 13px;
      color: #374151;
      line-height: 1.5;
      white-space: pre-wrap;
      background-color: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      flex: 1;
      overflow-y: auto;
      display: none;
    }
  </style>
  <script defer src="popup.js"></script>
</head>
<body>
  <div id="app">
    <h2><span>📄</span> AI Webpage Summarizer</h2>
    <button id="summarizeBtn">Summarize This Page</button>
    <div id="loader" class="loader">Analyzing &amp; summarizing...</div>
    <div id="result"></div>
  </div>
</body>
</html>
