<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      font-family: Arial, sans-serif;
      padding: 15px;
      margin: 0;
      background: #f9f9f9;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      color: #333;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4F46E5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #4338CA;
    }
    #result {
      margin-top: 15px;
      font-size: 13px;
      color: #444;
      line-height: 1.4;
      white-space: pre-wrap;
      background: white;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      max-height: 300px;
      overflow-y: auto;
    }
    .loader {
      text-align: center;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>AI Webpage Summarizer</h2>
  <button id="summarizeBtn">Summarize This Page</button>
  <div id="loader" class="loader" style="display: none;">Analyzing & summarizing...</div>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
